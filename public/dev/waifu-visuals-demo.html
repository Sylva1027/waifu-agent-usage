<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Waifu 视觉效果预览</title>
    <link rel="stylesheet" href="./waifu-visuals/demo.css" />
    <link rel="stylesheet" href="./waifu-visuals/index.css" />
  </head>
  <body class="demo-body">
    <main class="demo-shell">
      <header class="preview-header">
        <h1 class="demo-title">Waifu 视觉效果预览</h1>
        <p class="demo-note">分别打开三个 Demo，比较画面、动效和 12、15、30 FPS 的实际绘制。</p>
      </header>
      <nav class="preview-links" aria-label="视觉效果">
        <a href="./waifu-visuals/badge/">
          <div class="specimen specimen-badge">
            <img src="/assets/achievements/A01/gold.webp" alt="" width="102" height="102" />
          </div>
          <div class="description">
            <h2>成就徽章</h2>
            <p>比较原 WebP、立体侧壁和等级预览</p>
          </div>
          <span aria-hidden="true">↗</span>
        </a>
        <a href="./waifu-visuals/notice/">
          <div class="specimen specimen-notice" aria-hidden="true"><span>新成就</span></div>
          <div class="description">
            <h2>通知粒子</h2>
            <p>模拟解锁，对比光点和短光线</p>
          </div>
          <span aria-hidden="true">↗</span>
        </a>
        <a href="./waifu-visuals/skin/">
          <div class="specimen specimen-skin">
            <img src="/assets/skins/light/DeepSeek-lineart.webp" alt="" width="108" height="128" />
          </div>
          <div class="description">
            <h2>角色空间背景</h2>
            <p>比较原始立绘、细光环与稀疏轨道</p>
          </div>
          <span aria-hidden="true">↗</span>
        </a>
      </nav>
    </main>
  </body>
</html>
