<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../demo.css" />
    <link rel="stylesheet" href="./skin.css" />
    <title>角色空间背景 · Waifu Agent Usage</title>
  </head>
  <body class="demo-body">
    <main class="skin-lab">
      <header class="lab-heading">
        <a href="../index.html">‹ 视觉实验</a>
        <h1>角色空间背景</h1>
      </header>
      <section class="controls" aria-label="角色与背景">
        <label>角色<select id="skin"></select></label>
        <label>主题<select id="theme"><option value="light">浅色</option><option value="dark">深色</option></select></label>
        <div class="background-choice">
          <label>背景<select id="effect"><option value="original">原图</option><option value="lab" selected>AI Lab 标识</option></select></label>
          <output for="skin effect" id="lab-name" hidden></output>
        </div>
        <label class="opacity-control">透明度 <output for="opacity" id="opacity-value">50%</output><input type="range" id="opacity" min="0" max="100" value="50" /></label>
        <label class="check"><input type="checkbox" id="characters" checked />显示角色</label>
        <label class="check"><input type="checkbox" id="parallax" />鼠标视差</label>
      </section>
      <section id="stage" aria-label="角色与看板预览">
        <div id="art" aria-hidden="true">
          <canvas id="fx" hidden></canvas>
          <div id="logo-fallback" hidden></div>
          <img id="side" class="portrait" alt="" />
          <img id="front" class="portrait" alt="" />
        </div>
        <div id="board">
          <header><strong>Agent Usage</strong><small>示例数据</small></header>
          <div class="metrics">
            <div><small>总 Token</small><b>42.8M</b></div>
            <div><small>输入 Token</small><b>31.9M</b></div>
            <div><small>输出 Token</small><b>10.9M</b></div>
          </div>
          <div class="ranking">
            <b>模型用量</b>
            <div><span>GPT-5</span><i style="--share: 84%"></i></div>
            <div><span>Claude</span><i style="--share: 62%"></i></div>
            <div><span>Gemini</span><i style="--share: 44%"></i></div>
            <div><span>DeepSeek</span><i style="--share: 25%"></i></div>
          </div>
        </div>
      </section>
      <section class="playback" aria-label="固定轨迹回放">
        <label>帧率<select id="fps"><option>12</option><option selected>15</option><option>30</option></select> FPS</label>
        <button id="play" type="button" disabled>播放固定轨迹</button>
        <button id="stop" type="button" disabled>停止</button>
        <output id="stats" aria-live="off">静止</output>
      </section>
    </main>
    <script type="module" src="./skin.js"></script>
  </body>
</html>
